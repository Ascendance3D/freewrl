name: Bug Scan
# Scheduled static bug scan (tools/bug-scan): gcc -fanalyzer and warnings over the Linux X11
# build, cppcheck, and a TODO/FIXME/XXX inventory. New findings become GitHub issues labeled
# bug-scan and queued-for-owner-review, deduplicated against every earlier bug-scan issue (open
# or closed). Issues are reports only: Jules is dispatched only from an owner-approved JULES-NNN
# issue (docs/automation/JULES_DISPATCH.md section 3.1). This is not PR QA; PR QA stays local.
# Triggers: the weekly schedule and workflow_dispatch only. Never add pull_request or
# pull_request_target: the scan files issues with a write token.
# The job runs on GitHub-hosted ubuntu-latest (the self-hosted linux-proxmox runner was retired
# 2026-11-04). The install step adds the FreeWRL X11 build dependencies, autotools and cppcheck;
# gcc 13 and python3 come with the image. The scan runs one compile at a time (past runs: 21 to 28 minutes).
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      max_new:
        description: Most new issues to file in this run
        default: '10'
        type: string
      dry_run:
        description: Scan and report only; file no issues
        default: false
        type: boolean
permissions:
  contents: read
  issues: write
concurrency:
  group: bug-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq autoconf automake libtool pkg-config cppcheck python3 unzip \
            libx11-dev libxt-dev libxmu-dev libxaw7-dev libxext-dev libxxf86vm-dev libgl-dev libglu1-mesa-dev libglew-dev \
            libfreetype-dev libfontconfig-dev libcurl4-openssl-dev libxml2-dev libexpat1-dev libpng-dev libjpeg-dev zlib1g-dev \
            libimlib2-dev libopenal-dev libalut-dev
      - name: Preflight
        run: |
          missing=
          for t in autoreconf libtool pkg-config make gcc cppcheck python3 git; do
            command -v $t > /dev/null || missing="$missing $t"
          done
          [ -z "$missing" ] || { echo "::error::missing on runner:$missing"; exit 1; }
          gcc --version | head -n 1
      - name: Scan
        # One compile at a time, at low priority, each capped at 8 GB (one -fanalyzer compile reached
        # 5.3 GB; the hosted runner has 16 GB). The scan itself is unchanged.
        run: nice -n 10 tools/bug-scan/scan.sh -j 1 -m 8192 -o "$RUNNER_TEMP/bug-scan"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bug-scan
          path: ${{ runner.temp }}/bug-scan
          retention-days: 30
      - name: File issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_NEW: ${{ github.event.inputs.max_new || '10' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'yes' || '' }}
        run: |
          case $MAX_NEW in ''|*[!0-9]*) echo "::error::max_new must be a number"; exit 1 ;; esac
          python3 -I tools/bug-scan/file_issues.py "$RUNNER_TEMP/bug-scan/findings.json" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --max-new "$MAX_NEW" ${DRY_RUN:+--dry-run}
