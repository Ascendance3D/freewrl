name: macOS Release (draft)
# Build and package one Apple Silicon release from an EXACT annotated tag, then create a DRAFT
# GitHub Release with the archive, its SHA256SUMS.txt and a release-manifest.json. It NEVER
# publishes: Ryan reviews the draft and publishes by hand. It is manual-dispatch only; it does not
# trigger on a tag push. It does not create or move tags, and does not touch SourceForge.
# See RELEASING.md and tools/macos-release/README.md.
#
# Before the build it PROVES, and stops on any failure:
#   * the tag matches vMAJOR.MINOR.PATCH[-beta.N] and exists and is ANNOTATED;
#   * the tag peels to expected_sha and that commit is reachable from origin/master;
#   * the tag's FW_BUILD_VERSION_STR agrees with the tag version;
#   * the supplied run is formal-release evidence: the successful MANUAL validation run of
#     .github/workflows/macos.yml (macOS Release Validation): conclusion success, head_sha ==
#     expected_sha, event workflow_dispatch, head_branch master, workflow file
#     .github/workflows/macos.yml (read from the Actions run API; push and pull_request runs are
#     refused);
#   * no GitHub Release already exists for the tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to build, e.g. v6.8.0 or v6.8.0-beta.1
        required: true
      expected_sha:
        description: Full 40-char commit SHA the tag must point at
        required: true
      ci_run_id:
        description: Run ID of the successful manual (workflow_dispatch) master run of .github/workflows/macos.yml (macOS Release Validation) for expected_sha
        required: true
      prerelease:
        description: Mark the draft as a pre-release
        type: boolean
        default: false

# Least privilege: read the repo and Actions run metadata; write only to create the draft release.
permissions:
  contents: write
  actions: read

concurrency:
  group: macos-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  MACOS_MIN: '14.0'
  TAG: ${{ github.event.inputs.tag }}
  EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
  CI_RUN_ID: ${{ github.event.inputs.ci_run_id }}

jobs:
  # The standard macos-15 runner builds the package with MACOS_MIN=14.0.
  # The earlier validation run proved the runtime on a real macOS 14 runner.
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: validate inputs
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$' \
            || { echo "tag '$TAG' is not a valid release tag"; exit 1; }
          echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-fA-F]{40}$' \
            || { echo "expected_sha must be a full 40-char SHA"; exit 1; }
          echo "$CI_RUN_ID" | grep -Eq '^[0-9]+$' \
            || { echo "ci_run_id must be numeric"; exit 1; }

      # exact tag; full history and the annotated tag object so peel/reachability can be proven
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: fetch origin/master and the annotated tag
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          git fetch origin +refs/tags/$TAG:refs/tags/$TAG
          echo "checked out: $(git rev-parse HEAD)"

      - name: validate the release tag (read-only)
        run: tools/macos-release/verify-release.sh --tag "$TAG" --expected-sha "$EXPECTED_SHA"

      # Formal-release evidence contract (fail-closed): the run must be a successful manual
      # (workflow_dispatch) run on master of the workflow FILE .github/workflows/macos.yml for
      # exactly expected_sha. The facts come from the Actions run API record, which carries the
      # workflow path; the display name alone is not proof. push and pull_request runs are refused.
      - name: verify the run is formal-release evidence (manual validation run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > run.json
          field() { python3 -c 'import json,sys;v=json.load(open("run.json")).get(sys.argv[1]);print("null" if v is None else v)' "$1"; }
          CONCL=$(field conclusion); HEAD=$(field head_sha); EVENT=$(field event)
          BRANCH=$(field head_branch); WPATH=$(field path); WNAME=$(field name)
          echo "run $CI_RUN_ID: path='$WPATH' name='$WNAME' event='$EVENT' branch='$BRANCH' conclusion='$CONCL' head=$HEAD"
          tools/macos-release/check-ci-run.sh \
            --conclusion "$CONCL" --head-sha "$HEAD" --expected-sha "$EXPECTED_SHA" \
            --event "$EVENT" --head-branch "$BRANCH" --workflow-path "$WPATH" --workflow-name "$WNAME"

      - name: refuse if a release already exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "a GitHub Release already exists for $TAG; a published version is immutable"; exit 1
          fi
          echo "no existing release for $TAG"

      - name: dependencies from source (empty prefix)
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/deps"
          tools/macos-deps/build.sh -t "$MACOS_MIN" -p "$RUNNER_TEMP/deps" -c "$RUNNER_TEMP/deps-src"

      - name: build and package from the exact tag
        run: |
          set -euo pipefail
          tools/macos-package/package.sh -t "$MACOS_MIN" -D "$RUNNER_TEMP/deps" -z -o "$RUNNER_TEMP/pkg" \
            > package.log 2>&1 || { tail -60 package.log; exit 1; }
          grep -E "embedded|licenses:|Mach-O files|PASS|FAIL|ERROR" package.log || true

      - name: package verification and document-type gate
        run: |
          set -euo pipefail
          APP=$RUNNER_TEMP/pkg/FreeWRL.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" = "$MACOS_MIN"
          test "$(lipo -archs "$APP/Contents/MacOS/FreeWRL")" = arm64
          python3 tools/macos-package/verify.py --source-root "$GITHUB_WORKSPACE" --macos "$MACOS_MIN" "$APP"
          tools/macos-ci/doctypes.sh "$APP"

      - name: built app version matches the tag
        # Read CFBundleShortVersionString from the BUILT app and require it to equal the tag version.
        # This prevents source or build-setting drift from producing a release with the wrong bundle
        # version.
        run: tools/macos-release/check-app-version.sh --app "$RUNNER_TEMP/pkg/FreeWRL.app" --tag "$TAG"

      - name: name the asset to the release contract
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          ASSET="FreeWRL-${VERSION}-macOS-arm64.zip"
          mv "$RUNNER_TEMP/pkg/FreeWRL-macos-arm64.zip" "$RUNNER_TEMP/pkg/$ASSET"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: generate release metadata (checksums + manifest)
        run: |
          set -euo pipefail
          tools/macos-release/make-release-metadata.sh \
            --archive "$RUNNER_TEMP/pkg/$ASSET" \
            --version "$VERSION" --tag "$TAG" --commit "$EXPECTED_SHA" \
            --min-macos "$MACOS_MIN" --out "$RUNNER_TEMP/pkg"

      - name: verify checksums against the archive bytes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pkg"
          shasum -a 256 -c SHA256SUMS.txt
          MSHA=$(python3 -c 'import json;print(json.load(open("release-manifest.json"))["sha256"])')
          FSHA=$(awk '{print $1}' SHA256SUMS.txt)
          test "$MSHA" = "$FSHA" || { echo "manifest sha != SHA256SUMS"; exit 1; }
          echo "checksums agree: $FSHA"

      - name: write draft release notes
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pkg/NOTES.md" <<EOF
          FreeWRL Revival for Mac Silicon — $VERSION

          - Version: $VERSION
          - Tag: $TAG
          - Commit: $EXPECTED_SHA
          - Platform: macOS (Apple Silicon, arm64)
          - Minimum macOS: $MACOS_MIN

          Assets:
          - $ASSET
          - SHA256SUMS.txt (verify with: shasum -a 256 -c SHA256SUMS.txt)
          - release-manifest.json

          Source code archives are attached automatically by GitHub.

          This is a draft. Ryan reviews and publishes the final release.
          EOF

      - name: create the DRAFT release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRE=""
          [ "${{ github.event.inputs.prerelease }}" = "true" ] && PRE="--prerelease"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft $PRE \
            --title "FreeWRL Revival for Mac Silicon $VERSION" \
            --notes-file "$RUNNER_TEMP/pkg/NOTES.md" \
            "$RUNNER_TEMP/pkg/$ASSET" \
            "$RUNNER_TEMP/pkg/SHA256SUMS.txt" \
            "$RUNNER_TEMP/pkg/release-manifest.json"
          echo "DRAFT release created for $TAG. It is NOT published. Ryan publishes it by hand."

      - name: summary
        if: always()
        run: |
          {
            echo "### macOS release (draft) for ${TAG}"
            echo "- commit: ${EXPECTED_SHA}"
            echo "- asset: ${ASSET:-not built}"
            echo "- state: DRAFT only — not published"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-metadata
          path: |
            ${{ runner.temp }}/pkg/*.zip
            ${{ runner.temp }}/pkg/SHA256SUMS.txt
            ${{ runner.temp }}/pkg/release-manifest.json
            ${{ runner.temp }}/pkg/package.log
