name: macOS Release Validation
# FORMAL RELEASE VALIDATION ONLY. GitHub Actions is not a development test system here.
# Development and PR QA run locally. Pushes and pull requests do NOT start this workflow.
# Ryan starts it by hand (workflow_dispatch) from master for one exact commit:
#   expected_sha  the full 40-char commit SHA. The run fails at once unless expected_sha is 40 hex
#                 characters, the run is on master, and github.sha equals expected_sha.
# It is the evidence run that .github/workflows/release-macos.yml accepts (tools/macos-release/
# check-ci-run.sh: workflow_dispatch, master, exact SHA, this file's path, conclusion success).
# There is one fixed test contract. There is no profile selector.
# Supported: macOS 14 Sonoma and newer on Apple Silicon. Everything here targets
# MACOSX_DEPLOYMENT_TARGET=14.0 (MACOS_MIN stays 14.0).
# Runners:
#   build, asan:  macOS-Runner (organization larger runner, macOS 15, Apple Silicon M2). The macOS 15
#                 image does not change the product minimum: the package still targets 14.0 and every
#                 package minos check still requires 14.0.
#   runtime:      standard macos-14. This is the real minimum-supported-OS runtime proof.
# Jobs:
#   build:    host-only container tests (tools/c-tests, no app launch), FreeType, ODE and freealut
#             from their pinned source archives into an empty prefix, Release and Debug builds, the
#             standalone package (ad-hoc signed), verify.py, doctypes
#   runtime:  the same package on macOS 14: smoke fixtures, then (only when smoke passed)
#             world-replacement cycles and texture stress. One FreeWRL at a time.
#   asan:     Debug + AddressSanitizer: world replacement with PROTO worlds and the texture
#             fixtures. Every AddressSanitizer report fails the gate; suite.sh classifies them
#             (PROTO lifetime, Frustum extent stack, Vector, GLCore client attributes, other).
# Stress counts (tools/macos-ci/suite.sh reads CYC/CSEC/TEX/TSTB/TSEC):
#   runtime: release 2 cycles x 120 s, 10 + 5 texture runs x 25 s.
#   asan:    2 cycles x 120 s, 3 + 2 texture runs x 30 s.
# Focused start-up or diagnostic checks (tools/macos-ci/startup.sh) are local development QA.
# No secrets are used; signing with a Developer ID and notarization happen outside CI.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-char commit SHA of master to validate (the run fails unless github.sha equals it)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: macos-release-validation-${{ github.event.inputs.expected_sha }}
  cancel-in-progress: false
env:
  MACOS_MIN: '14.0'
  EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
jobs:
  build:
    runs-on: macOS-Runner
    timeout-minutes: 60
    steps:
      # first step, before checkout: refuse a wrong branch or a moving commit
      - name: guard (expected_sha, master, exact commit)
        run: |
          set -eu
          echo "expected_sha=$EXPECTED_SHA ref_name=$GITHUB_REF_NAME sha=$GITHUB_SHA"
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-fA-F]{40}$' \
            || { echo "expected_sha must be exactly 40 hexadecimal characters"; exit 1; }
          test "$GITHUB_REF_NAME" = master \
            || { echo "release validation runs from master only, not '$GITHUB_REF_NAME'"; exit 1; }
          test "$(printf '%s' "$GITHUB_SHA" | tr 'A-F' 'a-f')" = "$(printf '%s' "$EXPECTED_SHA" | tr 'A-F' 'a-f')" \
            || { echo "github.sha $GITHUB_SHA does not equal expected_sha $EXPECTED_SHA"; exit 1; }
      - uses: actions/checkout@v5
      - name: environment
        run: sw_vers; xcodebuild -version; uname -m
      - name: host-only container tests (Vector.c, list.c; no app launch)
        run: tools/c-tests/run-containers.sh
      # Cache the from-source dependency prefix (FreeType, ODE, freealut). The key is the deps
      # build script itself, which pins every version and SHA-256, so a version bump busts the
      # cache and rebuilds. RUNNER_TEMP is stable on GitHub's hosted runners, so absolute paths in
      # the restored prefix stay valid. This only speeds the build job; runtime and ASan are
      # unaffected (they run the app, they do not compile the deps).
      - name: cache the from-source dependency prefix
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps
          key: macos-deps-${{ env.MACOS_MIN }}-${{ hashFiles('tools/macos-deps/build.sh') }}
      - name: dependencies from source (on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          test ! -e "$RUNNER_TEMP/deps"
          tools/macos-deps/build.sh -t "$MACOS_MIN" -p "$RUNNER_TEMP/deps" -c "$RUNNER_TEMP/deps-src"
      - name: show dependency versions (cache hit or fresh build)
        run: cat "$RUNNER_TEMP/deps/share/freewrl-deps/packages.tsv"
      - name: Release build and package
        run: |
          tools/macos-package/package.sh -t "$MACOS_MIN" -D "$RUNNER_TEMP/deps" -z -o "$RUNNER_TEMP/pkg" > package.log 2>&1 || { tail -60 package.log; exit 1; }
          grep -E "embedded|licenses:|Mach-O files|PASS|FAIL|ERROR" package.log
          cp package.log "$RUNNER_TEMP/pkg/"
      - name: package checks
        run: |
          APP=$RUNNER_TEMP/pkg/FreeWRL.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' $APP/Contents/Info.plist)" = "$MACOS_MIN"
          test "$(lipo -archs $APP/Contents/MacOS/FreeWRL)" = arm64
          for f in $APP/Contents/MacOS/FreeWRL $APP/Contents/Frameworks/*.dylib; do
            m=$(vtool -show-build "$f" | awk '/minos/{print $2}'); echo "$(basename $f): minos $m"
            test "$m" = "$MACOS_MIN"
          done
          test "$(ls $APP/Contents/Frameworks | wc -l | tr -d ' ')" = 3
          test ! -e $APP/Contents/PlugIns
          python3 tools/macos-package/verify.py --source-root "$GITHUB_WORKSPACE" --macos "$MACOS_MIN" "$APP"
          # document-type routing gate (PR #18): bare extensions + the openURLs: loader handler.
          # The live LaunchServices open needs a GUI session (tools/macos-ci/launchservices.sh,
          # a mandatory release-QA step); here we run the deterministic static half.
          tools/macos-ci/doctypes.sh "$APP"
          # negative control: the unpackaged build links the prefix and must fail the gate
          if python3 tools/macos-package/verify.py --macos "$MACOS_MIN" "$RUNNER_TEMP/pkg/DerivedData/Build/Products/Release/FreeWRL.app" > negative.txt; then
            cat negative.txt; echo "verify.py passed an unpackaged build"; exit 1
          fi
          tail -3 negative.txt
      - name: Debug build
        run: |
          xcodebuild -project OSX_gui/FreeWRL-Desktop/FreeWRL.xcodeproj -scheme FreeWRL -configuration Debug \
            ARCHS=arm64 CODE_SIGN_IDENTITY=- FW_DEPS="$RUNNER_TEMP/deps" -derivedDataPath "$RUNNER_TEMP/dd-debug" \
            build > debug.log 2>&1 || { tail -40 debug.log; exit 1; }
          E=$RUNNER_TEMP/dd-debug/Build/Products/Debug/FreeWRL.app/Contents/MacOS/FreeWRL
          vtool -show-build "$E" | grep -q "minos $MACOS_MIN"
      - name: keep the dependency prefix for the ASan job
        run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/deps.tgz" deps
      - uses: actions/upload-artifact@v6
        with:
          name: package
          path: |
            ${{ runner.temp }}/pkg/FreeWRL-macos-arm64.zip
            ${{ runner.temp }}/pkg/FreeWRL-macos-arm64.zip.sha256
            ${{ runner.temp }}/pkg/package.log
      - uses: actions/upload-artifact@v6
        with: {name: deps, path: "${{ runner.temp }}/deps.tgz"}

  runtime:
    needs: build
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with: {name: package, path: pkg}
      - name: unpack
        run: |
          sw_vers; uname -m; sudo DevToolsSecurity -enable || true
          (cd pkg && shasum -a 256 -c FreeWRL-macos-arm64.zip.sha256)
          ditto -x -k pkg/FreeWRL-macos-arm64.zip "$RUNNER_TEMP/app"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$RUNNER_TEMP/app/FreeWRL.app/Contents/Info.plist"
      - name: smoke fixtures
        run: |
          OUT=$RUNNER_TEMP/out; mkdir -p $OUT
          set -o pipefail
          tools/macos-ci/smoke.sh "$RUNNER_TEMP/app/FreeWRL.app" $OUT | tee $OUT/smoke.txt
      # runs only when smoke passed: a failed smoke skips the stress and fails the job, while the
      # summary, crash reports and artifacts below are still collected
      - name: world-replacement cycles and texture stress
        run: |
          OUT=$RUNNER_TEMP/out
          set -o pipefail
          export CYC=2 CSEC=120 TEX=10 TSTB=5 TSEC=25
          echo "cycles=$CYC x ${CSEC}s textures=$TEX+$TSTB x ${TSEC}s"
          tools/macos-ci/suite.sh "$RUNNER_TEMP/app/FreeWRL.app" $OUT release | tee $OUT/results.txt
      - name: summary
        if: always()
        run: |
          OUT=$RUNNER_TEMP/out
          { echo "### package on macos-14 ($(sw_vers -productVersion), $(uname -m)), expected_sha $EXPECTED_SHA"; echo '```'
            grep -hm1 GL_RENDERER $OUT/*.err $OUT/*.out 2>/dev/null | head -1
            cat $OUT/smoke.txt 2>/dev/null
            grep '^GATE' $OUT/results.txt 2>/dev/null || echo "stress not run (smoke failed)"; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: collect crash reports
        if: always()
        run: mkdir -p $RUNNER_TEMP/out/crash; cp ~/Library/Logs/DiagnosticReports/FreeWRL* $RUNNER_TEMP/out/crash/ 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: runtime-macos-14, path: "${{ runner.temp }}/out"}

  asan:
    needs: build
    runs-on: macOS-Runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with: {name: deps, path: depsart}
      - name: build (Debug, AddressSanitizer)
        run: |
          sw_vers; sudo DevToolsSecurity -enable || true
          tar -C "$RUNNER_TEMP" -xzf depsart/deps.tgz
          xcodebuild -project OSX_gui/FreeWRL-Desktop/FreeWRL.xcodeproj -scheme FreeWRL -configuration Debug \
            ARCHS=arm64 CODE_SIGN_IDENTITY=- FW_DEPS="$RUNNER_TEMP/deps" -derivedDataPath "$RUNNER_TEMP/dd" \
            -enableAddressSanitizer YES GCC_OPTIMIZATION_LEVEL=1 'OTHER_CFLAGS=$(inherited) -fsanitize-recover=address' \
            build > build.log 2>&1 || { tail -40 build.log; exit 1; }
      - name: world replacement and texture lifetime under ASan
        run: |
          OUT=$RUNNER_TEMP/out; mkdir -p $OUT
          set -o pipefail
          export CYC=2 CSEC=120 TEX=3 TSTB=2 TSEC=30
          echo "cycles=$CYC x ${CSEC}s textures=$TEX+$TSTB x ${TSEC}s"
          tools/macos-ci/suite.sh "$RUNNER_TEMP/dd/Build/Products/Debug/FreeWRL.app" $OUT asan | tee $OUT/results.txt
      - name: summary
        if: always()
        run: |
          OUT=$RUNNER_TEMP/out
          { echo "### ASan ($(sw_vers -productVersion)), expected_sha $EXPECTED_SHA"; echo '```'; cat $OUT/results.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: asan, path: "${{ runner.temp }}/out"}
