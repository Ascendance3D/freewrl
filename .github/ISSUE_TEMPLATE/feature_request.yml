name: Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should FreeWRL do?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Who needs this, and for which worlds or workflows?
    validations:
      required: true
  - type: input
    id: standard
    attributes:
      label: Relevant VRML or X3D standard
      description: Node, field or clause, for example "X3D 4.0, 12.4.2 ImageTexture".
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you considered.
