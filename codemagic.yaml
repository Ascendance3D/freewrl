workflows:
  freewrl-light:
    name: FreeWRL light macOS probe
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: 16.0

    scripts:
      - name: Machine info
        script: |
          set -euo pipefail
          sw_vers
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          xcodebuild -version
          clang --version

      - name: Repo info
        script: |
          set -euo pipefail
          pwd
          git rev-parse --show-toplevel
          git rev-parse HEAD
          git status --short

      - name: Shell syntax check
        script: |
          set -euo pipefail
          find tools -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Regression XML check
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          roots = [
              Path("freewrl/tests/regression"),
              Path("tests/regression"),
          ]

          count = 0
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*.x3d"):
                  ET.parse(path)
                  count += 1

          print(f"XML_OK files={count}")
          PY

  # Supplemental full build: builds, packages, verifies and smoke-tests FreeWRL on Apple Silicon,
  # reusing the same scripts as the GitHub macOS CI. GitHub Actions stays the FINAL gate; this is a
  # faster supplemental signal. The deps, package, verify, doctypes and smoke steps fail the build
  # (smoke was report-only while the app had an intermittent early exit, fixed in MainLoop.c
  # fwl_draw, PR #53).
  freewrl-macos:
    name: FreeWRL macOS build + package (supplemental)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 16.0
      vars:
        MACOS_MIN: "14.0"

    cache:
      cache_paths:
        - $CM_BUILD_DIR/deps
        - $CM_BUILD_DIR/deps-src

    scripts:
      - name: Machine info
        script: |
          set -euo pipefail
          sw_vers; uname -m; xcodebuild -version

      - name: Host-only container tests
        script: |
          set -euo pipefail
          tools/c-tests/run-containers.sh

      - name: Dependencies from source (cached)
        script: |
          set -euo pipefail
          if [ ! -x "$CM_BUILD_DIR/deps/bin/freetype-config" ] && [ ! -d "$CM_BUILD_DIR/deps/lib" ]; then
            tools/macos-deps/build.sh -t "$MACOS_MIN" -p "$CM_BUILD_DIR/deps" -c "$CM_BUILD_DIR/deps-src"
          else
            echo "reusing cached deps in $CM_BUILD_DIR/deps"
          fi

      - name: Release build and package
        script: |
          set -euo pipefail
          tools/macos-package/package.sh -t "$MACOS_MIN" -D "$CM_BUILD_DIR/deps" -z -o "$CM_BUILD_DIR/pkg"

      - name: Package verification and document-type gate
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/pkg/FreeWRL.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" = "$MACOS_MIN"
          test "$(lipo -archs "$APP/Contents/MacOS/FreeWRL")" = arm64
          python3 tools/macos-package/verify.py --source-root "$CM_BUILD_DIR" --macos "$MACOS_MIN" "$APP"
          tools/macos-ci/doctypes.sh "$APP"

      - name: Smoke
        script: |
          set -euo pipefail
          OUT="$CM_BUILD_DIR/out"; mkdir -p "$OUT"
          tools/macos-ci/smoke.sh "$CM_BUILD_DIR/pkg/FreeWRL.app" "$OUT" | tee "$OUT/smoke.txt"

    artifacts:
      - $CM_BUILD_DIR/pkg/FreeWRL-macos-arm64.zip
      - $CM_BUILD_DIR/pkg/FreeWRL-macos-arm64.zip.sha256
      - $CM_BUILD_DIR/pkg/package.log
      - $CM_BUILD_DIR/out/*
